name: Markdown Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            **/*.md